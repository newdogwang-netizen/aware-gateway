# OpenRouter test config — real API calls
server:
  listen: ":12026"
  timeout: 120s
  graceful_shutdown: 10s

retry:
  max_retries: 2
  retryable_statuses: [429, 500, 502, 503]

circuit_breaker:
  threshold: 10
  window: 60s
  open_duration: 30s

tracing:
  enabled: false
  exporter: stdout
  service_name: aware-gateway
  sample_rate: 1.0

pools:
  openrouter:
    strategy: round_robin
    health_check:
      interval: 60s
      timeout: 10s
    endpoints:
      - name: openrouter-primary
        url: https://openrouter.ai/api
        health_path: /v1/models
        weight: 10
        timeout: 120s
        auth_token_env: GW_OPENROUTER_KEY
        # No static models — let auto-discovery find them

routes:
  - pattern: /v1/chat/completions
    pool: openrouter
  - pattern: /v1/completions
    pool: openrouter
  - pattern: /v1/models
    pool: openrouter
  - pattern: /v1/embeddings
    pool: openrouter

model_map: {}

plugins:
  ratelimit:
    enabled: true
    global_rps: 20

  otel-genai:
    enabled: true
    convention: gen_ai
    system_overrides:
      openrouter: openrouter

  task-router:
    enabled: true
    default_strategy: cheapest
    prefer_healthy: true
    models:
      - name: "z-ai/glm-5.3-flash"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 131072
        input_price: 0.075
        output_price: 0.25
      - name: "qwen/qwen3.8-flash"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 131072
        input_price: 0.15
        output_price: 0.47
      - name: "openai/gpt-4o-mini"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning", "vision"]
        context_window: 128000
        input_price: 0.15
        output_price: 0.60
      - name: "openai/gpt-4o"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning", "vision"]
        context_window: 128000
        input_price: 2.50
        output_price: 10.00
      - name: "deepseek/deepseek-v3.2"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 131072
        input_price: 0.27
        output_price: 1.10
    rules:
      - task: reasoning
        strategy: best_quality
      - task: code
        strategy: best_quality
      - task: chat
        strategy: cheapest

  audit:
    enabled: true
    store: both
    sqlite_path: ./data/audit-openrouter.db
    log_truncate_body: 1024

# Pricing for cost calculation (USD per 1M tokens)
pricing:
  enabled: true
  default:
    prompt: 1.0
    completion: 3.0
  models:
    "z-ai/glm-5.3-flash":
      prompt: 0.075
      completion: 0.25
    "qwen/qwen3.8-flash":
      prompt: 0.15
      completion: 0.47
    "meta-llama/llama-3.1-8b-instruct":
      prompt: 0.05
      completion: 0.08
    "openai/gpt-4o-mini":
      prompt: 0.15
      completion: 0.60
    "openai/gpt-4o":
      prompt: 2.50
      completion: 10.00
    "deepseek/deepseek-v3.2":
      prompt: 0.27
      completion: 1.10

# OpenRouter test config — real API calls
server:
  listen: ":12026"
  timeout: 900s
  graceful_shutdown: 10s

retry:
  max_retries: 1
  retryable_statuses: [429, 500, 502, 503]

circuit_breaker:
  threshold: 10
  window: 60s
  open_duration: 30s

tracing:
  enabled: false
  exporter: stdout
  service_name: aware-gateway
  sample_rate: 1.0

pools:
  openrouter:
    strategy: round_robin
    health_check:
      interval: 60s
      timeout: 10s
    endpoints:
      - name: openrouter-primary
        url: https://openrouter.ai/api
        health_path: /v1/models
        weight: 10
        timeout: 900s
        auth_token_env: GW_OPENROUTER_KEY
        # No static models — let auto-discovery find them

routes:
  - pattern: /v1/chat/completions
    pool: openrouter
  - pattern: /v1/completions
    pool: openrouter
  - pattern: /v1/models
    pool: openrouter
  - pattern: /v1/embeddings
    pool: openrouter

model_map:
  # Harbor uses LiteLLM's `openai/` provider prefix for the gateway's
  # OpenAI-compatible endpoint. Canonicalize those request model IDs before
  # forwarding to OpenRouter and before pricing/reasoning policy is applied.
  "openai/auto": "auto"
  "openai/auto-opus-warmstart": "auto-opus-warmstart"
  "openai/z-ai/glm-5.3-flash": "z-ai/glm-5.3-flash"
  "openai/openai/gpt-5.6-sol": "openai/gpt-5.6-sol"
  "openai/anthropic/claude-opus-5": "anthropic/claude-opus-5"

plugins:
  ratelimit:
    enabled: true
    global_rps: 20

  otel-genai:
    enabled: true
    convention: gen_ai
    system_overrides:
      openrouter: openrouter

  # Smart router: LLM-based model selection (runs before task-router)
  smart-router:
    enabled: true
    endpoint: "https://openrouter.ai/api/v1"
    model: "openai/gpt-5.6-sol"
    api_key_env: "GW_OPENROUTER_KEY"
    max_tokens: 1000
    temperature: 0
    timeout_ms: 30000
    decision_input_price: 2.00
    decision_output_price: 10.00
    disable_thinking: false
    # The decision model now runs through OpenRouter, not the removed local
    # decision endpoint. Two quick retries protect against transient EOFs/timeouts
    # without retrying the actual agent/provider calls.
    decision_retries: 2
    # If the decision model times out or returns an invalid/unknown model, route directly
    # to the strongest fallback instead of letting task-router choose a
    # mid-tier model.
    fallback_model: "anthropic/claude-opus-5"
    fallback_pool: "openrouter"
    prompt_preview_chars: 2000
    include_system_prompt: true
    include_message_count: true
    # Give the decision model compact short-term memory within a trial.
    # Each routed call appends one short context_summary/reason; the next call
    # sees at most the latest 5 records.
    decision_history_turns: 5
    decision_history_context_chars: 220
    # Disable decision caching for measurement runs so each turn records an
    # independent decision-model routing decision. Re-enable for product smoke tests.
    cache_ttl_seconds: -1
    cache_max_entries: 10000
    # V4 warm-start strategy: use Opus for the first N agent calls in a
    # session, then fall back to normal decision-model routing over the same menu.
    warm_start:
      trigger_models: ["auto-opus-warmstart"]
      steps: 5
      model: "anthropic/claude-opus-5"
      pool: "openrouter"
    # Decision menu for the V4 experiment: only compare flash vs strongest premium.
    # Keep budget/mid-tier models out of the decision model's choices so smart-router
    # results are attributable to "cheap unless upgrade is needed".
    models:
      # Ultra-cheap tier
      - name: "z-ai/glm-5.3-flash"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1310720
        input_price: 0.07
        output_price: 0.25
      # Strongest premium tier
      - name: "anthropic/claude-opus-5"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning", "vision"]
        context_window: 200000
        input_price: 5.00
        output_price: 25.00

  # Rule-based router: keyword classify + score (fallback for smart-router)
  task-router:
    enabled: true
    default_strategy: cheapest
    prefer_healthy: true
    models:
      # Ultra-cheap tier (no leaderboard, but fastest/cheapest)
      - name: "z-ai/glm-5.3-flash"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1310720
        input_price: 0.07
        output_price: 0.25
      # Budget tier — Terminal-Bench 4.0 leaderboard #8 (17.3% resolution)
      - name: "openai/gpt-5.6-luna"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning", "vision"]
        context_window: 1050000
        input_price: 0.20
        output_price: 1.20
      # Mid tier — Terminal-Bench 4.0 leaderboard #3 (41.8% resolution)
      - name: "z-ai/glm-5.3"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1310720
        input_price: 1.40
        output_price: 4.40
      # Premium tier — Terminal-Bench 4.0 leaderboard #4 (37.3% resolution)
      - name: "openai/gpt-5.6-sol"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning", "vision"]
        context_window: 1050000
        input_price: 2.00
        output_price: 10.00
      # Strongest local anchor / smart-router fallback
      - name: "anthropic/claude-opus-5"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning", "vision"]
        context_window: 200000
        input_price: 5.00
        output_price: 25.00
    rules:
      - task: reasoning
        strategy: best_quality
      - task: code
        strategy: best_quality
      - task: chat
        strategy: cheapest

  audit:
    enabled: true
    store: both
    sqlite_path: ./data/audit-openrouter.db
    log_truncate_body: 1024

# Pricing for cost calculation (USD per 1M tokens)
# Sourced from OpenRouter /v1/models API — verified Aug 2026
pricing:
  enabled: true
  default:
    prompt: 1.0
    completion: 3.0
  models:
    # Ultra-cheap
    "z-ai/glm-5.3-flash":
      prompt: 0.07
      completion: 0.25
    "qwen/qwen3.7-flash":
      prompt: 0.03
      completion: 0.13
    # Budget
    "deepseek/deepseek-v4-flash":
      prompt: 0.09
      completion: 0.18
    "openai/gpt-5.6-luna":
      prompt: 0.20
      completion: 1.20
    # Mid
    "deepseek/deepseek-v4-pro":
      prompt: 1.60
      completion: 3.20
    "z-ai/glm-5.3":
      prompt: 1.40
      completion: 4.40
    # Premium
    "openai/gpt-5.6-sol":
      prompt: 2.00
      completion: 10.00
    "anthropic/claude-opus-5":
      prompt: 5.00
      completion: 25.00

# OpenRouter test config — real API calls
server:
  listen: ":12026"
  timeout: 120s
  graceful_shutdown: 10s

retry:
  max_retries: 2
  retryable_statuses: [429, 500, 502, 503]

circuit_breaker:
  threshold: 10
  window: 60s
  open_duration: 30s

tracing:
  enabled: false
  exporter: stdout
  service_name: aware-gateway
  sample_rate: 1.0

pools:
  openrouter:
    strategy: round_robin
    health_check:
      interval: 60s
      timeout: 10s
    endpoints:
      - name: openrouter-primary
        url: https://openrouter.ai/api
        health_path: /v1/models
        weight: 10
        timeout: 120s
        auth_token_env: GW_OPENROUTER_KEY
        # No static models — let auto-discovery find them

routes:
  - pattern: /v1/chat/completions
    pool: openrouter
  - pattern: /v1/completions
    pool: openrouter
  - pattern: /v1/models
    pool: openrouter
  - pattern: /v1/embeddings
    pool: openrouter

model_map: {}

plugins:
  ratelimit:
    enabled: true
    global_rps: 20

  otel-genai:
    enabled: true
    convention: gen_ai
    system_overrides:
      openrouter: openrouter

  # Smart router: LLM-based model selection (runs before task-router)
  smart-router:
    enabled: true
    endpoint: "http://localhost:18000/v1"
    model: "qwen3.8-27b"
    api_key: ""
    max_tokens: 500
    temperature: 0
    timeout_ms: 15000
    prompt_preview_chars: 500
    include_system_prompt: true
    include_message_count: true
    cache_ttl_seconds: 300
    cache_max_entries: 10000
    # Model menu — populated from task-router models below via auto-discovery
    # If empty, smart-router builds menu from pool endpoints
    models:
      - name: "z-ai/glm-5.3-flash"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1310720
        input_price: 0.07
        output_price: 0.25
      - name: "google/gemma-4-31b-it"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 262144
        input_price: 0.09
        output_price: 0.34
      - name: "openai/gpt-5.6-luna"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1050000
        input_price: 0.20
        output_price: 1.20
      - name: "z-ai/glm-5.3"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1310720
        input_price: 1.40
        output_price: 4.40
      - name: "openai/gpt-5.6-sol"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1050000
        input_price: 2.00
        output_price: 10.00

  # Rule-based router: keyword classify + score (fallback for smart-router)
  task-router:
    enabled: true
    default_strategy: cheapest
    prefer_healthy: true
    models:
      # Ultra-cheap tier (no leaderboard, but fastest/cheapest)
      - name: "z-ai/glm-5.3-flash"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1310720
        input_price: 0.07
        output_price: 0.25
      # Budget tier — Terminal-Bench 4.0 leaderboard #8 (17.3% resolution)
      - name: "openai/gpt-5.6-luna"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning", "vision"]
        context_window: 1050000
        input_price: 0.20
        output_price: 1.20
      # Budget tier — new generation, no leaderboard yet
      - name: "deepseek/deepseek-v4-flash"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1048576
        input_price: 0.09
        output_price: 0.18
      # Mid tier — Terminal-Bench 4.0 leaderboard #3 (41.8% resolution)
      - name: "z-ai/glm-5.3"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning"]
        context_window: 1310720
        input_price: 1.40
        output_price: 4.40
      # Premium tier — Terminal-Bench 4.0 leaderboard #4 (37.3% resolution)
      - name: "openai/gpt-5.6-sol"
        pool: "openrouter"
        capabilities: ["chat", "code", "reasoning", "vision"]
        context_window: 1050000
        input_price: 2.00
        output_price: 10.00
    rules:
      - task: reasoning
        strategy: best_quality
      - task: code
        strategy: best_quality
      - task: chat
        strategy: cheapest

  audit:
    enabled: true
    store: both
    sqlite_path: ./data/audit-openrouter.db
    log_truncate_body: 1024

# Pricing for cost calculation (USD per 1M tokens)
# Sourced from OpenRouter /v1/models API — verified Aug 2026
pricing:
  enabled: true
  default:
    prompt: 1.0
    completion: 3.0
  models:
    # Ultra-cheap
    "z-ai/glm-5.3-flash":
      prompt: 0.07
      completion: 0.25
    "qwen/qwen3.7-flash":
      prompt: 0.03
      completion: 0.13
    # Budget
    "deepseek/deepseek-v4-flash":
      prompt: 0.09
      completion: 0.18
    "openai/gpt-5.6-luna":
      prompt: 0.20
      completion: 1.20
    # Mid
    "deepseek/deepseek-v4-pro":
      prompt: 1.60
      completion: 3.20
    "z-ai/glm-5.3":
      prompt: 1.40
      completion: 4.40
    # Premium
    "openai/gpt-5.6-sol":
      prompt: 2.00
      completion: 10.00
    "anthropic/claude-opus-5":
      prompt: 5.00
      completion: 25.00
